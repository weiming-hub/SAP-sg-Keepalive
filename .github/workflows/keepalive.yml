name: SAP CF APP保活

on:
  schedule:
    - cron: "*/10 0 * * *"
  workflow_dispatch:


concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: KeepAlive via container
        uses: docker://ghcr.io/uncleluogithub/cf-keepalive:latest
        env:
          gh secret set CF_API      --body 'https://api.cf.ap21.hana.ondemand.com'
          gh secret set CF_ORG      --body '9202e17ctrial'
          gh secret set CF_SPACE    --body 'dev'
          gh secret set CF_APP      --body 'free-sgtajllj'
          gh secret set CF_USERNAME --body 'wei99w88@gmail.com'
          gh secret set CF_PASSWORD          # 交互输入，不留 history
          CF_SET_PROCESS_HC: "true"
          # 调试时打开
          # DEBUG: "1"
          # CF_TRACE: "true"
